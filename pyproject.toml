[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mia"
version = "0.1.0"
description = "Método de identificación de requisitos desde opiniones de usuarios (Apklis)"
requires-python = ">=3.12"
dependencies = [
    # PLN / ML
    "spacy==3.8.13",
    "sentence-transformers==5.6.0",
    "transformers==5.12.1",
    "scikit-learn==1.9.0",
    "numpy==2.5.0",
    "scipy==1.18.0",
    "pandas==3.0.3",
    # Web
    "django==6.0.6",
    "djangorestframework==3.17.1",
    "python-decouple==3.8",
    "psycopg2-binary==2.9.12",
    # Sirve los estáticos desde el propio proceso en el despliegue de
    # demostración (no hay Nginx delante). Ver Dockerfile.
    "whitenoise==6.12.0",
    # Utilidades
    "requests==2.34.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-django==4.12.0",
    "pytest-cov==7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "webapp.config.settings"
markers = [
    "modelo_real: carga spaCy y/o el modelo de embeddings reales (sin dobles de prueba); excluir con -m 'not modelo_real' si hace falta, pero debe correr en CI por defecto.",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nucleo*", "webapp*"]
