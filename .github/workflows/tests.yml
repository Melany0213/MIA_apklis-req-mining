name: Pruebas

on:
  push:
  pull_request:

env:
  MODELO_SPACY: es_core_news_sm
  MODELO_EMBEDDINGS: sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2

jobs:
  pytest:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: eco_user
          POSTGRES_PASSWORD: eco_password_ci
          POSTGRES_DB: eco_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: clave-secreta-solo-para-ci-no-usar-en-produccion
      DJANGO_DEBUG: "False"
      DB_NAME: eco_db
      DB_USER: eco_user
      DB_PASSWORD: eco_password_ci
      DB_HOST: localhost
      DB_PORT: "5432"
      SEMILLA_ALEATORIA: "42"

    steps:
      - uses: actions/checkout@v4

      # 3.14 es la versión con la que se congeló requirements-lock.txt y con
      # la que se obtuvieron las métricas de la tesis: CI debe correr sobre
      # ese mismo entorno, no sobre uno parecido.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Cachear el modelo de embeddings
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ env.MODELO_EMBEDDINGS }}

      # torch en variante CPU: el runner no tiene GPU y las ruedas CUDA son
      # ~2 GB de descarga inútil. Va antes del lock para que pip lo dé por
      # satisfecho y no traiga la versión con CUDA desde PyPI.
      - name: Instalar torch (CPU)
        run: pip install torch==2.12.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Instalar dependencias
        run: |
          pip install --upgrade pip
          pip install -r requirements-lock.txt

      - name: Descargar modelo de spaCy
        run: python -m spacy download "$MODELO_SPACY"

      # Imprescindible: `RepresentadorSemantico.cargar()` fuerza
      # HF_HUB_OFFLINE=1, así que durante las pruebas NO se puede descargar
      # nada. El modelo tiene que estar en la caché antes de llamar a pytest.
      - name: Descargar modelo de embeddings
        run: >-
          python -c "import os; from sentence_transformers import SentenceTransformer;
          SentenceTransformer(os.environ['MODELO_EMBEDDINGS'])"

      - name: Ejecutar pruebas (pytest)
        run: pytest
